<body>
<style>
/* Layout: one phone-first app column (Guest, Host); the Lane Monitor breaks out to a wide CRT scoring screen.
   World: a 1990s LA bowling alley at night + Walter's army-surplus kit. Single dark theme by design. */
:root {
  color-scheme: dark;
  --night: #120e16;
  --night-2: #1a1520;
  --panel: #201a26;
  --edge: #3b3140;
  --ink: #f4ead4;
  --muted: #b9ab90;
  --paper: #f4ead4;
  --paper-ink: #1b1620;
  --lane: #d39b55;
  --lane-deep: #9c6634;
  --red: #e83b2f;
  --red-deep: #9e2219;
  --red-ink: #c42b21; /* red for anything that carries text: 4.7:1 against paper */
  --khaki: #c4b384;
  --olive: #4d4c2b;
  --amber: #ffbe3d;
  --neon: #ff5d47;
  --crt-0: #07080a;
  --crt-1: #15130e;
  --bezel: #050506;
  --led: #ffb93a;
  --led-dim: #b8873a;
  --led-glow: rgba(255, 170, 40, .55);
  --font-neon: 'Monoton', 'Secular One', Impact, sans-serif;
  --font-stencil: 'Stardos Stencil', 'Secular One', Impact, sans-serif;
  --font-head: 'Secular One', 'Rubik', system-ui, sans-serif;
  --font-body: 'Rubik', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --font-led: 'VT323', 'Secular One', ui-monospace, Menlo, monospace;
}
:root[lang="he"] {
  --font-neon: 'Secular One', 'Rubik', Arial, sans-serif;
  --font-stencil: 'Secular One', 'Rubik', Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html.locked { overflow: hidden; }
body {
  margin: 0;
  background:
    radial-gradient(ellipse 80% 40% at 50% -5%, rgba(255, 93, 71, .16), transparent 70%),
    var(--night);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 0 40px;
  overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
h1, h2, h3 { font-family: var(--font-head); font-weight: 400; line-height: 1.15; text-wrap: balance; margin: 0; }
.h1 { font-size: 1.7rem; }
.h2 { font-size: 1.15rem; }
p { margin: 0; }

.app { max-width: 560px; margin-inline: auto; }
.app.wide { max-width: 1240px; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: rgba(18, 14, 22, .94);
  backdrop-filter: blur(8px);
  margin-inline: -16px; padding: 10px 16px 0;
  border-bottom: 1px solid var(--edge);
}
.topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 1240px; margin-inline: auto; }
.brand { display: flex; flex-direction: column; min-width: 0; line-height: 1; }
.brand-pre { font-family: var(--font-stencil); font-size: .72rem; letter-spacing: .32em; color: var(--khaki); }
.brand-main {
  font-family: var(--font-neon); font-size: clamp(1.45rem, 7.4vw, 2rem); color: var(--neon);
  text-shadow: 0 0 6px rgba(255, 93, 71, .75), 0 0 20px rgba(255, 93, 71, .4);
  white-space: nowrap;
}
:root[lang="he"] .brand-pre { letter-spacing: .05em; font-size: .85rem; }
:root[lang="he"] .brand-main { font-size: clamp(1.6rem, 8vw, 2.1rem); }
.top-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.lang { display: inline-flex; border: 1px solid var(--edge); border-radius: 999px; overflow: hidden; }
.lang-btn { background: transparent; border: 0; padding: 6px 11px; font-size: .85rem; color: var(--muted); min-height: 36px; }
.lang-btn[aria-pressed="true"] { background: var(--khaki); color: var(--night); font-weight: 700; }
.icon-btn {
  display: inline-grid; place-items: center; width: 40px; height: 40px;
  background: var(--panel); border: 1px solid var(--edge); border-radius: 999px; color: var(--ink);
}
.icon-btn .ico-off { display: none; }
.icon-btn.muted .ico-on { display: none; }
.icon-btn.muted .ico-off { display: block; }
.icon-btn.muted { color: var(--muted); }
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; margin-top: 10px; max-width: 1240px; margin-inline: auto; }
.modes button {
  background: transparent; border: 0; border-bottom: 3px solid transparent;
  padding: 8px 4px 9px; font-family: var(--font-stencil); font-size: .8rem; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted);
}
:root[lang="he"] .modes button { font-size: .95rem; letter-spacing: 0; }
.modes button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--red); }

.demo-banner {
  margin-block: 12px; padding: 7px 10px; font-size: .78rem; line-height: 1.4; color: var(--khaki);
  background: rgba(77, 76, 43, .35); border-inline-start: 3px solid var(--amber); border-radius: 4px;
}

/* ---------- shared controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 10px 18px; border-radius: 8px; border: 1px solid var(--edge);
  background: var(--panel); color: var(--ink);
  font-family: var(--font-stencil); font-size: .95rem; letter-spacing: .06em; text-transform: uppercase;
}
:root[lang="he"] .btn { letter-spacing: 0; font-size: 1.02rem; }
.btn-primary { background: var(--red-ink); border-color: var(--red-ink); color: var(--paper); box-shadow: 0 3px 0 var(--red-deep); }
.btn-primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--red-deep); }
.btn-amber { background: var(--amber); border-color: var(--amber); color: var(--night); }
.btn-block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.linkish { background: none; border: 0; padding: 4px 0; color: var(--amber); text-decoration: underline; text-underline-offset: 3px; font-size: .88rem; }
label { display: block; font-size: .86rem; font-weight: 500; color: var(--muted); }
input[type="text"], input:not([type]), select, textarea {
  width: 100%; margin-top: 6px; padding: 11px 12px; font-size: 16px;
  background: var(--night-2); border: 1px solid var(--edge); border-radius: 8px; color: var(--ink);
}
textarea { resize: vertical; min-height: 64px; }
.field-hint { font-size: .8rem; color: var(--muted); margin-top: 6px; }
.form-error { color: var(--paper); background: var(--red-deep); border-radius: 6px; padding: 8px 10px; font-size: .9rem; }
.tag {
  display: inline-block; font-family: var(--font-body); font-size: .66rem; letter-spacing: .06em; text-transform: uppercase;
  padding: 1px 6px; border-radius: 999px; border: 1px solid currentColor; color: var(--muted); vertical-align: middle;
}
.tag-me { color: var(--amber); }
.pill { font-family: var(--font-stencil); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--edge); color: var(--muted); }
:root[lang="he"] .pill { font-size: .8rem; letter-spacing: 0; }
.pill-strike { background: var(--red-ink); border-color: var(--red-ink); color: var(--paper); }
.pill-open { border-color: var(--amber); color: var(--amber); }
.pill-locked { border-style: dashed; }
.pill-off { opacity: .7; }

/* ---------- views ---------- */
.view { display: grid; gap: 16px; }

/* join */
.join { background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; overflow: hidden; }
.lane-strip {
  height: 26px; border-bottom: 5px solid var(--red);
  background:
    linear-gradient(90deg, transparent 47%, rgba(27, 22, 32, .55) 47% 53%, transparent 53%) center / 64px 100% repeat-x,
    repeating-linear-gradient(90deg, var(--lane) 0 17px, var(--lane-deep) 17px 18px);
}
.join-body { padding: 18px 16px 20px; display: grid; gap: 14px; }
.join-title { font-size: 1.8rem; }
.join-form { display: grid; gap: 12px; }
.how { margin: 0; padding-inline-start: 1.3em; display: grid; gap: 4px; color: var(--muted); font-size: .92rem; }
.how li::marker { font-family: var(--font-stencil); color: var(--amber); }
.live-now { border-top: 1px dashed var(--edge); padding-top: 12px; display: grid; gap: 6px; }
.live-now-title { font-family: var(--font-stencil); font-size: .76rem; letter-spacing: .14em; text-transform: uppercase; color: var(--khaki); }
:root[lang="he"] .live-now-title { letter-spacing: 0; font-size: .9rem; }
.live-now ol { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--font-led); font-size: 1.25rem; color: var(--led); }
.tagline { font-size: .86rem; color: var(--muted); font-style: italic; }

/* lane header */
.shoe-tag {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--panel); border: 1px solid var(--edge); border-inline-start: 6px solid var(--khaki);
  border-radius: 10px; padding: 12px 14px;
}
.shoe-left { display: grid; gap: 2px; min-width: 0; }
.shoe-lane { font-family: var(--font-stencil); font-size: .74rem; letter-spacing: .2em; text-transform: uppercase; color: var(--khaki); }
:root[lang="he"] .shoe-lane { letter-spacing: 0; font-size: .9rem; }
.shoe-name { font-family: var(--font-head); font-size: 1.45rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shoe-score { display: grid; justify-items: end; line-height: 1; }
.shoe-score-label { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.led { font-family: var(--font-led); color: var(--led); text-shadow: 0 0 6px var(--led-glow), 0 0 16px var(--led-glow); }
.shoe-score .led { font-size: 3.1rem; }
.shoe-max { font-family: var(--font-led); color: var(--led-dim); font-size: 1.2rem; }
.perfect { font-size: .86rem; color: var(--muted); }
.hint-strip { display: grid; gap: 2px; background: var(--amber); color: var(--night); border-radius: 8px; padding: 9px 12px; font-weight: 500; }
.hint-label { font-family: var(--font-stencil); font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; }
:root[lang="he"] .hint-label { letter-spacing: 0; font-size: .85rem; }
.subtabs { display: flex; gap: 6px; border-bottom: 1px solid var(--edge); }
.subtabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; color: var(--muted); font-family: var(--font-head); font-size: 1.02rem; }
.subtabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--amber); }
.panel-stack { display: grid; gap: 14px; }

/* score sheet: the paper sheet from the bowling alley counter */
.scoresheet {
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  background: var(--paper); color: var(--paper-ink);
  border: 2px solid var(--paper-ink); border-radius: 3px;
  box-shadow: 0 10px 24px rgba(0, 0, 0, .35);
}
.frame {
  position: relative; min-height: 70px; padding: 0; margin: 0; background: transparent; color: inherit; text-align: start;
  border: 0; border-inline-end: 1px solid var(--paper-ink); border-bottom: 1px solid var(--paper-ink);
  display: grid; grid-template-rows: 18px 1fr;
}
.frame:nth-child(5n) { border-inline-end: 0; }
.f-num { background: var(--paper-ink); color: var(--paper); font-family: var(--font-stencil); font-size: .72rem; display: grid; place-items: center; }
.f-box {
  position: absolute; top: 18px; inset-inline-end: 0; width: 26px; height: 24px;
  border-inline-start: 1px solid var(--paper-ink); border-bottom: 1px solid var(--paper-ink);
  display: grid; place-items: center; font-family: var(--font-head); font-size: 1.15rem; color: var(--red-ink);
}
.frame.is-done .f-box { transform-origin: center; }
.frame.is-done .f-box span { display: inline-block; transform: rotate(-8deg); }
.frame.is-locked .f-box { color: var(--paper-ink); }
.frame.is-off { background: repeating-linear-gradient(45deg, transparent 0 6px, rgba(27, 22, 32, .14) 6px 7px); }
.frame.is-off .f-box { color: var(--paper-ink); }
.f-cum { align-self: end; padding: 0 7px 6px; font-family: var(--font-head); font-size: 1.12rem; }
.f-total { grid-column: 1 / -1; border: 0; display: flex; align-items: center; justify-content: space-between; min-height: 0; }
.f-total .f-num { padding: 6px 12px; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; align-self: stretch; }
:root[lang="he"] .f-total .f-num { letter-spacing: 0; font-size: .9rem; }
.f-total-val { font-family: var(--font-head); font-size: 1.6rem; padding: 4px 14px; }
.frame.just { animation: just 1.1s ease-out; }
@keyframes just { 0% { background: var(--amber); } 100% { background: transparent; } }
@media (min-width: 520px) {
  .scoresheet { grid-template-columns: repeat(10, minmax(0, 1fr)) minmax(0, 1.5fr); }
  .frame:nth-child(5n) { border-inline-end: 1px solid var(--paper-ink); }
  .frame:nth-child(10) { border-inline-end: 1px solid var(--paper-ink); }
  .frame { border-bottom: 0; }
  .f-box { width: 22px; height: 22px; font-size: 1rem; }
  .f-total { grid-column: auto; display: grid; grid-template-rows: 18px 1fr; }
  .f-total .f-num { padding: 0; font-size: .66rem; letter-spacing: .08em; }
  .f-total-val { display: grid; place-items: center; padding: 0; }
}

/* mission list */
.missions { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.mission {
  width: 100%; display: grid; grid-template-columns: 2.5rem minmax(0, 1fr) auto; gap: 12px; align-items: center;
  text-align: start; background: var(--panel); border: 1px solid var(--edge); border-radius: 10px; padding: 12px;
}
.mission:hover { border-color: var(--khaki); }
.m-num { width: 2.5rem; height: 2.5rem; display: grid; place-items: center; border-radius: 6px; background: var(--khaki); color: var(--night); font-family: var(--font-stencil); font-size: 1.25rem; }
.mission.st-strike .m-num { background: var(--red-ink); color: var(--paper); }
.mission.st-locked { border-style: dashed; }
.mission.st-off { opacity: .55; }
.m-body { display: grid; gap: 2px; min-width: 0; }
.m-title { font-family: var(--font-head); font-size: 1.02rem; line-height: 1.25; }
.m-desc { font-size: .84rem; color: var(--muted); line-height: 1.35; }
.m-side { display: grid; justify-items: end; gap: 6px; }
.m-thumb { width: 42px; height: 42px; object-fit: cover; border-radius: 6px; border: 2px solid var(--paper); }

/* leaderboard + album */
.board { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.board li {
  display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto; gap: 10px; align-items: center;
  background: var(--panel); border: 1px solid var(--edge); border-radius: 8px; padding: 8px 12px;
}
.board li.is-me { border-color: var(--amber); }
.b-rank { font-family: var(--font-led); font-size: 1.5rem; color: var(--led-dim); }
.b-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.b-score { font-family: var(--font-led); font-size: 1.6rem; color: var(--led); font-variant-numeric: tabular-nums; }
.album { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.album figure { margin: 0; position: relative; }
.album img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; display: block; max-width: 100%; }
.album figcaption { position: absolute; inset-inline-start: 6px; bottom: 6px; background: var(--paper-ink); color: var(--paper); font-family: var(--font-stencil); font-size: .68rem; padding: 1px 6px; border-radius: 3px; }
.empty { grid-column: 1 / -1; color: var(--muted); font-size: .92rem; border: 1px dashed var(--edge); border-radius: 8px; padding: 14px; }

/* ---------- lane monitor (CRT) ---------- */
.crt {
  position: relative; overflow: hidden;
  background: radial-gradient(ellipse at 50% 40%, var(--crt-1) 0%, var(--crt-0) 78%);
  border: 10px solid var(--bezel); border-radius: 22px;
  box-shadow: inset 0 0 70px rgba(0, 0, 0, .85), 0 0 0 2px var(--edge), 0 24px 60px rgba(0, 0, 0, .5);
  color: var(--led); font-family: var(--font-led); font-size: 1.3rem; line-height: 1.15;
  padding: 16px; display: grid; gap: 14px;
}
.crt::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, .04) 0 1px, transparent 1px 3px);
}
.crt:fullscreen { border-radius: 0; border-width: 0; padding: 3vw; align-content: start; background-color: var(--crt-0); }
.crt .glow, .crt-title, .bw-name, .bw-score, .mr-score { text-shadow: 0 0 5px var(--led-glow), 0 0 14px var(--led-glow); }
.crt-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px; position: relative; z-index: 1; }
.crt-title { font-size: 2.1rem; text-transform: uppercase; letter-spacing: .06em; line-height: 1; }
.crt-sub { color: var(--led-dim); text-transform: uppercase; font-size: 1.15rem; }
.crt-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.crt-btn { background: transparent; border: 1px solid var(--led-dim); color: var(--led); font-family: var(--font-led); font-size: 1.15rem; padding: 6px 10px; border-radius: 4px; min-height: 40px; text-transform: uppercase; }
.crt-btn:hover { border-color: var(--led); }
.crt-btn[aria-pressed="true"] { background: var(--led); color: var(--crt-0); }
.sim-badge { font-size: 1rem; color: var(--crt-0); background: var(--led); padding: 2px 8px; border-radius: 3px; animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }
.crt-grid { display: grid; gap: 16px; position: relative; z-index: 1; }
@media (min-width: 860px) { .crt-grid { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); } }
.mon-board { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.mon-row {
  display: grid; grid-template-columns: 2ch minmax(0, 1fr) auto 3.4ch; gap: 10px; align-items: center;
  padding: 6px 8px; border: 1px solid rgba(122, 90, 34, .45); border-radius: 4px; font-size: 1.55rem;
}
.mon-row.is-me { border-color: var(--led); background: rgba(255, 185, 58, .07); }
.mr-rank { color: var(--led-dim); }
.mr-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: uppercase; }
.mr-name .tag { font-size: .62rem; color: var(--led-dim); border-color: var(--led-dim); }
.mr-name .tag-me { color: var(--led); border-color: var(--led); }
.mr-frames { display: flex; gap: 3px; }
.mr-frames i { width: 11px; height: 15px; border: 1px solid var(--led-dim); display: block; }
.mr-frames i.x { background: var(--led); border-color: var(--led); box-shadow: 0 0 6px var(--led-glow); }
.mr-frames i.off { opacity: .2; }
.mr-score { text-align: end; font-variant-numeric: tabular-nums; }
@media (max-width: 480px) {
  .mon-row { grid-template-columns: 2ch minmax(0, 1fr) 3.4ch; }
  .mr-frames { grid-column: 2 / 3; grid-row: 2; }
  .mr-score { grid-row: 1; grid-column: 3; }
}
.crt-side { display: grid; gap: 12px; align-content: start; }
.bowler { border: 2px solid var(--led-dim); border-radius: 6px; padding: 12px; display: grid; gap: 2px; }

      h.on[i] = el.checked;
    }
    else if (el.id === 'host-showcodes') h.showCodes = el.checked;
    else return;
    save();
    renderData();
  });
  hostEl.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var h = state.host;
    if (b.id === 'host-tenth') {
      h.tenth = !h.tenth;
      if (h.tenth) { pushTicker({ kind: 'sys' }); sndStrike(); toast(t('tkTenth')); } else sndTick();
    } else if (b.hasAttribute('data-hint')) {
      var k = +b.getAttribute('data-hint');
      h.hintPreset = h.hintPreset === k ? null : k;
      sndTick();
    } else if (b.id === 'host-hint-show') {
      var txt = $('#host-hint').value.trim();
      if (!txt) { toast(t('hintEmpty')); $('#host-hint').focus(); return; }
      h.hintCustom = txt; h.hintPreset = null;
      sndTick();
    } else if (b.id === 'host-hint-clear') {
      h.hintCustom = ''; h.hintPreset = null;
      $('#host-hint').value = '';
      sndTick();
    } else if (b.id === 'host-copy') {
      copyLink(); return;
    } else if (b.id === 'host-reset') {
      $('#host-reset-confirm').hidden = false; $('#host-reset-yes').focus(); return;
    } else if (b.id === 'host-reset-no') {
      $('#host-reset-confirm').hidden = true; $('#host-reset').focus(); return;
    } else if (b.id === 'host-reset-yes') {
      doReset(); return;
    } else return;
    save();
    renderData();
  });

  window.addEventListener('hashchange', function () {
    if (location.hash !== '#join') return;
    closeMission();
    forceJoin = true;
    state.mode = 'guest';
    renderModes();
    fillJoin();
    renderGuest();
    $('#join-name').focus();
  });

  /* ---------- boot ---------- */
  renderAll();
  if (forceJoin) { $('#join-name').focus(); }
  save();
})();
</script>
</body>
</html>
