<title>Big Lebowski Live Solo</title>
<meta name="description" content="Book Naf Steinmetz as Walter, the rule-enforcing bowling legend, live at weddings, bar and bat mitzvahs, club nights and dinner parties in Israel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Rubik:wght@400;500;700&family=Secular+One&family=Stardos+Stencil:wght@400;700&family=Suez+One&display=swap">
</head>
<body>
<style>
/* Layout: one long bowling lane at night. Sections are boards down the alley, data sits on paper score sheets, and the hero pairs a neon marquee with a lane-side poster and a working foul line. */
:root{
  color-scheme:dark;
  --alley:#111410; --alley-2:#181c16; --alley-3:#22281f; --counter:#1b1610; --felt-1:#17130e; --felt-2:#110e0a; --pit:#0a0b09;
  --paper:#f0e6cb; --paper-2:#e4d8b7; --paper-warm:#f6e0b0; --paper-dim:#b2a88d; --ink:#1e1b15; --ink-dim:#5d5646;
  --maple:#d89d56; --maple-2:#cf9450; --maple-3:#e0a964; --maple-deep:#9c6431; --gutter:#2b1d12;
  --foul:#e3392e; --foul-deep:#8f1d16; --foul-ink:#fff6ea; --foul-btn:#c42b21; --foul-paper:#a8231a; --foul-dark:#ff6b5e; --err:#ff8f84;
  --khaki:#c6b282; --olive:#5f6035; --go:#86e3a6;
  --neon:#ffd36c; --neon-core:#fff4d4; --candle:#ffb648;
  --brass:#d1ab5e; --brass-dark:#8a682b; --brass-ink:#2f220a;
  --wa:#2fb768; --wa-ink:#062211;
  --rule:rgba(240,230,203,.14); --rule-strong:rgba(240,230,203,.32);
  --shadow:0 18px 40px rgba(0,0,0,.5);
  --font-logo:'Monoton','Secular One',Impact,'Arial Black',sans-serif;
  --font-stencil:'Stardos Stencil','Secular One','Arial Black',sans-serif;
  --font-head:'Secular One','Rubik','Arial Black',sans-serif;
  --font-body:'Rubik','Segoe UI',Arial,sans-serif;
  --nav-h:64px;
}
:root[lang="he"]{--font-logo:'Suez One','Secular One',Georgia,serif;--font-stencil:'Secular One','Rubik',Arial,sans-serif}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:calc(var(--nav-live,var(--nav-h)) + 20px)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--alley);color:var(--paper);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
img{max-width:100%}
a{color:var(--neon)}
.wrap{width:100%;max-width:1180px;margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--neon);outline-offset:3px}
h1,h2,h3{font-family:var(--font-head);font-weight:400;line-height:1.06;text-wrap:balance;margin:0}
h2{font-size:clamp(30px,5.2vw,54px)}
p{margin:0}
.eyebrow{display:inline-flex;align-items:center;gap:8px;margin:0 0 14px;padding:5px 10px;border:1px dashed rgba(198,178,130,.6);font-family:var(--font-stencil);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--khaki)}
:root[lang="he"] .eyebrow,:root[lang="he"] .hero-tag,:root[lang="he"] .chip,:root[lang="he"] .badge{letter-spacing:0}
.lead{max-width:62ch;margin-top:14px;color:var(--paper-dim);font-size:clamp(16px,1.6vw,19px)}
.sec{padding-block:clamp(56px,8vw,100px);border-top:1px solid var(--rule)}
.fine{font-size:13px;color:var(--paper-dim);margin-top:12px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border:2px solid transparent;border-radius:4px;font:600 16px/1.15 var(--font-body);text-decoration:none;text-align:center;cursor:pointer;transition:transform .15s ease,background-color .15s ease,border-color .15s ease}
.btn-foul{background:var(--foul-btn);color:var(--foul-ink);box-shadow:0 4px 0 var(--foul-deep)}
.btn-foul:hover{transform:translateY(-1px)}
.btn-foul:active{transform:translateY(3px);box-shadow:0 1px 0 var(--foul-deep)}
.btn-ghost{background:transparent;color:var(--paper);border-color:var(--rule-strong)}
.btn-ghost:hover{border-color:var(--khaki)}
.btn-wa{background:var(--wa);color:var(--wa-ink)}
.btn-ink{background:var(--ink);color:var(--paper)}
.btn-ghost-ink{background:transparent;color:var(--ink);border-color:var(--ink-dim)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.btn svg{width:18px;height:18px;flex:none}

/* Nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:rgba(17,20,16,.95);border-bottom:1px solid var(--rule)}
@supports (backdrop-filter:blur(8px)){.nav{background:rgba(17,20,16,.86);backdrop-filter:saturate(1.2) blur(8px)}}
.nav-row{display:flex;align-items:center;gap:10px;min-height:var(--nav-h)}
.logo{display:flex;flex-direction:column;justify-content:center;gap:4px;min-height:44px;margin-inline-end:auto;color:var(--neon-core);text-decoration:none;line-height:1;min-width:0}
.logo-main{font-family:var(--font-head);font-size:clamp(16px,2vw,20px);letter-spacing:.04em;white-space:nowrap;text-shadow:0 0 6px rgba(255,211,108,.8),0 0 16px rgba(227,57,46,.45)}
.logo-sub{font-family:var(--font-stencil);font-size:9.5px;letter-spacing:.2em;color:var(--khaki);white-space:nowrap}
:root[lang="he"] .logo-sub{letter-spacing:0;font-size:11px}
.nav-links{display:none;gap:16px}
.nav-links a{color:var(--paper-dim);text-decoration:none;font-size:14px;white-space:nowrap}
.nav-links a:hover{color:var(--paper)}
@media (min-width:1100px){.nav-links{display:flex}}
.nav-links .nl-low{display:none}
@media (min-width:1440px){.nav-links .nl-low{display:inline}}
.nav-tools{display:flex;align-items:center;gap:6px;flex:none}
.tool{display:inline-flex;align-items:center;gap:6px;height:44px;min-width:44px;justify-content:center;padding:0 10px;border:1px solid var(--rule-strong);border-radius:4px;background:transparent;color:var(--paper);font:600 13px/1 var(--font-body);cursor:pointer}
.tool svg{width:18px;height:18px;flex:none}
#btn-shabbos[aria-pressed="true"]{background:var(--candle);border-color:var(--candle);color:var(--ink)}
.tool-label{display:none}
@media (min-width:860px){.tool-label{display:inline}}
.lang span{opacity:.5}
:root[lang="en"] .lang .l-en,:root[lang="he"] .lang .l-he{opacity:1;color:var(--neon)}
#btn-mute .ico-off{display:none}
#btn-mute[aria-pressed="true"] .ico-on{display:none}
#btn-mute[aria-pressed="true"] .ico-off{display:block}
.nav-book{min-height:44px;padding:8px 14px;font-size:14px;box-shadow:none}
#btn-menu{display:inline-flex}
@media (min-width:1100px){#btn-menu{display:none}}
@media (max-width:699px){.nav-book,#btn-shabbos,#btn-mute{display:none}}
.shabbos-banner{padding-block:8px;background:linear-gradient(90deg,rgba(255,182,72,.22),rgba(255,182,72,.06));border-top:1px solid rgba(255,182,72,.35);color:var(--neon-core);font-size:14px}

/* Shabbos mode */
:root.shabbos body::after{content:"";position:fixed;inset:0;z-index:55;pointer-events:none;background:radial-gradient(closest-corner at 50% 50%,transparent 55%,rgba(8,6,3,.45) 100%)}
.candles{position:fixed;z-index:56;inset-block-end:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-end:18px;display:none;gap:12px;align-items:flex-end;pointer-events:none}
:root.shabbos .candles{display:flex}
@media (max-width:720px){:root.shabbos .candles{display:none}}
.banner-row{display:flex;align-items:center;gap:12px}
.banner-row .candle{flex:none;display:none}
@media (max-width:720px){.banner-row .candle{display:block}}
.candle{position:relative;width:14px;height:66px;border-radius:2px;background:linear-gradient(90deg,var(--paper-2),var(--paper) 45%,var(--paper-dim))}
.candle.small{width:10px;height:40px}
.flame{position:absolute;left:50%;bottom:100%;width:12px;height:22px;margin-left:-6px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,var(--neon-core),var(--candle) 55%,rgba(255,120,40,0) 76%);filter:drop-shadow(0 0 10px var(--candle));transform-origin:50% 90%}
.candle.small .flame{width:9px;height:16px;margin-left:-4.5px}
@media (prefers-reduced-motion:no-preference){.flame{animation:flick 1.7s ease-in-out infinite alternate}.candle:nth-child(2) .flame{animation-duration:2.1s}}
@keyframes flick{0%{transform:scale(1) rotate(-2deg)}40%{transform:scale(1.07,.94) rotate(2deg)}70%{transform:scale(.95,1.06) rotate(-1deg)}100%{transform:scale(1.03) rotate(1deg)}}

/* Hero */
.hero{padding-block:clamp(28px,5vw,64px) 36px;background:radial-gradient(80% 60% at 78% 0%,rgba(255,211,108,.08),transparent 62%),var(--alley)}
.hero-grid{display:grid;gap:clamp(28px,4vw,56px);align-items:center}
@media (min-width:900px){.hero-grid{grid-template-columns:minmax(0,1.12fr) minmax(0,.88fr)}}
.hero-copy{container-type:inline-size;min-width:0}
.marquee{font-family:var(--font-logo);font-weight:400;font-size:clamp(34px,7vw,80px);font-size:clamp(34px,12.4cqi,84px);line-height:1;letter-spacing:.02em;color:var(--neon-core);text-shadow:0 0 2px var(--neon-core),0 0 8px var(--neon),0 0 20px var(--neon),0 0 44px rgba(227,57,46,.55)}
.marquee span{display:block}
:root[lang="he"] .marquee{letter-spacing:0;line-height:1.08;font-size:clamp(44px,16cqi,110px)}
@media (prefers-reduced-motion:no-preference){.marquee{animation:tube 1.8s ease-out .15s both}}
@keyframes tube{0%{opacity:.18}6%{opacity:1}9%{opacity:.25}13%{opacity:1}22%{opacity:.6}25%{opacity:1}100%{opacity:1}}
.marquee-live{margin-top:10px;font-family:var(--font-stencil);font-weight:700;font-size:clamp(13px,1.6vw,16px);letter-spacing:.3em;color:var(--khaki)}
:root[lang="he"] .marquee-live{letter-spacing:0;font-size:clamp(16px,2vw,20px)}
.now{display:inline-grid;grid-template-columns:auto auto;align-items:center;gap:14px;margin-top:20px;padding:10px 16px;border:2px solid var(--rule-strong);background-color:var(--pit);background-image:radial-gradient(rgba(255,211,108,.09) 1px,transparent 1.3px);background-size:5px 5px}
.now-label{max-width:10ch;font-family:var(--font-stencil);font-size:12px;line-height:1.2;letter-spacing:.16em;text-transform:uppercase;color:var(--khaki)}
:root[lang="he"] .now-label{letter-spacing:0;font-size:14px}
.now-name{font-family:var(--font-head);font-size:clamp(30px,5vw,46px);line-height:1;letter-spacing:.08em;color:var(--foul);text-shadow:0 0 12px rgba(227,57,46,.7)}
.hero-line{max-width:32ch;margin-top:20px;font-family:var(--font-head);font-size:clamp(21px,2.6vw,28px);line-height:1.2;text-wrap:balance}
.hero-tag{margin-top:12px;font-family:var(--font-stencil);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--khaki)}
.hero-thesis{max-width:56ch;margin-top:12px;color:var(--paper-dim);font-size:17px}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.hero-explain{max-width:60ch;margin-top:18px;padding-inline-start:12px;border-inline-start:2px solid var(--olive);font-size:14px;color:var(--paper-dim)}
.hero-art{display:grid;gap:16px;align-items:end;justify-items:center;min-width:0}
.v-duo .hero-art{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}
.poster{width:100%;max-width:400px;margin:0;padding:10px 10px 12px;background:linear-gradient(140deg,var(--maple-3),var(--maple-deep));box-shadow:var(--shadow);transform:rotate(-1.5deg)}
.poster img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;object-position:50% 22%;background:var(--alley-3)}
.plate{display:grid;gap:2px;margin-top:10px;padding:8px 10px;text-align:center;background:linear-gradient(180deg,var(--brass),var(--brass-dark));color:var(--brass-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 0 rgba(0,0,0,.35)}
.plate-top{font-family:var(--font-stencil);font-weight:700;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.plate-name{font-family:var(--font-head);font-size:clamp(14px,1.8vw,17px);line-height:1.15}
.plate-stat{font-size:12px;font-variant-numeric:tabular-nums}
.dude-board{position:relative;width:100%;max-width:300px;margin:0;transform:rotate(1.5deg)}
.dude-board svg{display:block;width:100%;height:auto;filter:drop-shadow(0 14px 22px rgba(0,0,0,.5))}
.face-label{position:absolute;top:29%;left:50%;width:22%;transform:translate(-50%,-50%);text-align:center;font-size:clamp(9px,1.1vw,12px);line-height:1.15;color:var(--paper-dim);pointer-events:none}
.stamp-tag{position:absolute;z-index:2;padding:4px 10px;border:3px solid var(--foul);background:rgba(17,20,16,.75);color:var(--foul-dark);font-family:var(--font-stencil);font-weight:700;font-size:clamp(12px,1.6vw,16px);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;pointer-events:none}
.dude-board .stamp-tag{top:62%;left:50%;transform:translate(-50%,-50%) rotate(-12deg)}

/* Hero foul line */
.lane-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:32px 0 10px}
.lane-hint{font-family:var(--font-head);font-size:20px;color:var(--neon-core)}
.lane-sub{margin-top:2px;font-size:14px;color:var(--paper-dim)}
.mini-frame{flex:none;display:grid;grid-template-columns:auto 28px;min-width:100px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums}
.mf-label{padding:4px 6px;font-family:var(--font-stencil);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.mf-mark{display:grid;place-items:center;height:26px;border-inline-start:1px solid var(--ink);border-bottom:1px solid var(--ink);font-weight:700;color:var(--foul-paper)}
.mf-score{grid-column:1/-1;padding:2px 0 4px;text-align:center;font-family:var(--font-head);font-size:22px}
@media (prefers-reduced-motion:no-preference){.flip{animation:flip .45s ease}}
@keyframes flip{0%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.lane{position:relative;height:140px;border-radius:4px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;background:repeating-linear-gradient(180deg,var(--maple) 0 9px,var(--maple-2) 9px 10px,var(--maple-3) 10px 19px,var(--maple-deep) 19px 20px);box-shadow:inset 0 0 0 3px var(--gutter),inset 0 10px 18px rgba(0,0,0,.25),var(--shadow)}
.lane::before,.lane::after{content:"";position:absolute;left:0;right:0;height:14px;background:var(--gutter)}
.lane::before{top:0}.lane::after{bottom:0}
.lane-approach{position:absolute;top:14px;bottom:14px;left:0;width:64%;background:rgba(0,0,0,.12)}
.lane-dots{position:absolute;top:30%;bottom:30%;left:22%;width:28px;background-image:radial-gradient(var(--maple-deep) 2px,transparent 2.5px);background-size:14px 16px}
.foul-line{position:absolute;top:14px;bottom:14px;left:64%;width:6px;background:var(--foul);box-shadow:0 0 12px rgba(227,57,46,.75)}
.foul-line span{position:absolute;top:6px;left:12px;padding:2px 6px;background:var(--foul-btn);color:var(--foul-ink);font-family:var(--font-stencil);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.lane-arrows{position:absolute;top:50%;left:75%;display:flex;flex-direction:column;gap:12px;transform:translateY(-50%)}
.lane-arrows i{display:block;width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:13px solid var(--maple-deep)}
.lane-pins{position:absolute;top:50%;right:2.5%;height:96px;width:auto;transform:translateY(-50%)}
.shoe{position:absolute;top:50%;left:0;width:92px;height:46px;margin-top:-23px;border-radius:6px;cursor:grab;touch-action:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.45))}
.shoe:active{cursor:grabbing}
.shoe svg{display:block;width:100%;height:100%}
.shoe:focus-visible{outline:3px solid var(--neon);outline-offset:4px}
.stamp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.stamp span{max-width:92%;padding:8px 16px;border:4px double var(--foul);background:rgba(240,230,203,.94);color:var(--foul-paper);font-family:var(--font-stencil);font-weight:700;font-size:clamp(17px,3.6vw,34px);line-height:1.1;letter-spacing:.05em;text-align:center;text-transform:uppercase;transform:rotate(-5deg);box-shadow:0 6px 20px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:no-preference){.stamp:not([hidden]) span{animation:stampin .32s cubic-bezier(.2,1.6,.4,1)}.lane.flash{animation:laneflash .6s ease}}
@keyframes stampin{0%{transform:rotate(-5deg) scale(1.7);opacity:0}100%{transform:rotate(-5deg) scale(1);opacity:1}}
@keyframes laneflash{30%{box-shadow:inset 0 0 0 5px var(--foul),0 0 44px rgba(227,57,46,.85)}}
.lane-msg{min-height:1.6em;margin-top:10px;font-family:var(--font-head);font-size:18px}

/* League */
.roster{margin-top:28px;border:1px solid var(--rule-strong);background:var(--alley-2)}
.roster-head{display:none;grid-template-columns:96px minmax(0,1fr) 220px;gap:16px;padding:8px 16px;background:var(--paper-2);color:var(--ink);font-family:var(--font-stencil);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
@media (min-width:760px){.roster-head{display:grid}}
.member{position:relative;display:grid;grid-template-columns:84px minmax(0,1fr);gap:16px;padding:18px 16px;border-top:1px solid var(--rule)}
.member:first-of-type{border-top:0}
@media (min-width:760px){.member{grid-template-columns:96px minmax(0,1fr) 220px;align-items:center}}
.member-avatar{width:100%;aspect-ratio:1;overflow:hidden;background:var(--alley-3);border:2px solid var(--rule-strong)}
.member-avatar img,.member-avatar svg{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.member-name{font-family:var(--font-head);font-size:clamp(22px,2.6vw,28px)}
.member-played{margin-top:2px;font-size:14px;color:var(--khaki)}
.member-line{margin-top:6px;color:var(--paper-dim);max-width:52ch}
.member-act{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
@media (min-width:760px){.member-act{grid-column:auto;flex-direction:column;align-items:flex-start}}
.chip{display:inline-block;padding:4px 8px;border:1px solid currentColor;font-family:var(--font-stencil);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.chip-on{color:var(--go)}
.chip-off{color:var(--paper-dim)}
.member.is-off .member-avatar{filter:grayscale(.75) brightness(.8)}
.member.is-off .member-name{color:var(--paper-dim)}
.member .stamp-tag{position:static;display:inline-block;transform:rotate(-4deg)}
.member-tip{display:inline-flex;align-items:center;min-height:44px;font-size:15px}
.starring{display:grid;grid-template-columns:minmax(84px,140px) minmax(0,1fr);gap:clamp(14px,3vw,28px);align-items:center;margin-top:28px;padding:clamp(14px,3vw,24px);border:8px solid var(--maple-deep);background:linear-gradient(180deg,var(--brass),var(--brass-dark));color:var(--brass-ink);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.35)}
.starring img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 22%;border:4px solid var(--brass-ink)}
.starring .member-name{color:var(--brass-ink);font-size:clamp(26px,4vw,40px)}
.starring .member-played{color:var(--brass-ink)}
.starring .member-line{color:var(--brass-ink)}
.starring-label{font-family:var(--font-stencil);font-weight:700;font-size:13px;letter-spacing:.2em;text-transform:uppercase}
.starring .chip-on{color:var(--brass-ink);background:rgba(255,255,255,.25)}
.starring-joke{margin-top:10px;font-style:italic}
.starring .cta-row{margin-top:14px}

/* What he does */
.sheet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:1px;margin:28px 0 0;padding:1px;list-style:none;background:var(--rule-strong)}
.sheet-cell{padding:20px 18px 22px;background:var(--alley)}
.cell-label{display:block;margin-bottom:8px;font-family:var(--font-stencil);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--khaki)}
:root[lang="he"] .cell-label{letter-spacing:0;font-size:14px}
.cell-line{font-family:var(--font-head);font-size:clamp(19px,2vw,22px);line-height:1.25}
.how-title{margin-top:48px;font-size:clamp(24px,3vw,32px)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:1px;margin:16px 0 0;padding:1px;list-style:none;background:var(--rule-strong)}
.how li{position:relative;padding:18px;background:var(--alley)}
.how-box{position:absolute;top:0;inset-inline-end:0;display:grid;place-items:center;width:34px;height:34px;border-inline-start:1px solid var(--rule-strong);border-bottom:1px solid var(--rule-strong);font-family:var(--font-head);color:var(--neon)}
.how strong{display:block;margin-bottom:6px;padding-inline-end:40px;font-family:var(--font-head);font-weight:400;font-size:20px}
.how p{color:var(--paper-dim)}

/* Packages */
.sec-counter{background:var(--counter)}
.counter{display:grid;gap:28px;margin-top:28px}
@media (min-width:960px){.counter{grid-template-columns:minmax(0,1.5fr) minmax(290px,.8fr);align-items:start}}
.board{padding:clamp(12px,2.4vw,22px);border:6px solid var(--gutter);background:repeating-linear-gradient(180deg,var(--felt-1) 0 7px,var(--felt-2) 7px 8px);box-shadow:inset 0 0 30px rgba(0,0,0,.5)}
.board-group{margin:0;padding:0;border:0;min-width:0}
.board-group + .board-group{margin-top:22px}
.board-legend{padding:0;margin-bottom:6px;font-family:var(--font-stencil);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--khaki)}
:root[lang="he"] .board-legend{letter-spacing:0;font-size:15px}
.row{position:relative;display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 10px;border-bottom:1px dashed var(--rule);cursor:pointer}
.row:focus-within{outline:2px solid var(--neon);outline-offset:-2px}
.row input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.row.is-on{background:rgba(255,211,108,.07);box-shadow:inset 0 0 0 1px rgba(255,211,108,.45)}
.row.is-disabled{cursor:not-allowed}
.row.is-disabled .row-main,.row.is-disabled .row-price{opacity:.5}
.bulb{width:14px;height:14px;margin-top:6px;border-radius:50%;background:var(--alley-3);box-shadow:inset 0 0 0 2px rgba(0,0,0,.45)}
.row.is-check .bulb{border-radius:2px}
.row.is-on .bulb{background:var(--neon);box-shadow:0 0 10px var(--neon),0 0 2px var(--neon-core)}
.row-main{min-width:0}
.row-name{font-family:var(--font-head);font-size:20px;color:var(--paper)}
.row-dur{margin-inline-start:8px;font-family:var(--font-stencil);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--khaki)}
:root[lang="he"] .row-dur{letter-spacing:0;font-size:13px}
.row-desc{display:block;margin-top:4px;font-size:15px;color:var(--paper-dim)}
.row-note{display:block;margin-top:4px;font-size:13px;font-weight:600;color:var(--candle)}
.row-price{font-family:var(--font-head);font-size:20px;color:var(--neon);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{display:inline-block;margin-inline-start:8px;padding:3px 7px;background:var(--foul-btn);color:var(--foul-ink);font-family:var(--font-stencil);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;vertical-align:middle}
.badge-line{background:transparent;color:var(--khaki);border:1px solid var(--khaki)}
.badge-candle{background:var(--candle);color:var(--ink)}
.hours{display:flex;align-items:center;gap:10px;padding:10px 10px 14px 40px;padding-inline:40px 10px;border-bottom:1px dashed var(--rule);font-size:14px}
.hours input{width:76px;min-height:40px}
.shabbos-line{position:relative;margin-top:22px;padding:16px;border:1px solid rgba(255,182,72,.5);background:radial-gradient(120% 140% at 0% 0%,rgba(255,182,72,.22),rgba(255,182,72,.05) 55%,transparent),var(--counter);box-shadow:inset 0 0 40px rgba(255,160,50,.08)}
.shabbos-head{display:flex;gap:14px;align-items:flex-end;padding:4px 6px 12px;border-bottom:1px solid rgba(255,182,72,.35)}
.shabbos-head .candle{flex:none}
.shabbos-title{font-family:var(--font-head);font-size:24px;color:var(--neon-core)}
.shabbos-tag{font-size:14px;color:var(--candle)}
.shabbos-line .row.is-on{background:rgba(255,182,72,.12);box-shadow:inset 0 0 0 1px rgba(255,182,72,.6)}
.shabbos-line .fine{color:var(--paper)}
.duo-line{margin-top:22px;padding:14px;border:1px dashed var(--khaki)}
.duo-note{padding:6px 10px 0;font-size:14px;color:var(--khaki)}
.ticket{position:relative;padding:20px;background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
@media (min-width:960px){.ticket{position:sticky;top:calc(var(--nav-h) + 24px)}}
.ticket-head{display:flex;justify-content:space-between;gap:12px;padding-bottom:8px;border-bottom:2px solid var(--ink);font-family:var(--font-stencil);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.ticket-lines{margin:10px 0 0;padding:0;list-style:none}
.ticket-lines li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dotted rgba(30,27,21,.35);font-variant-numeric:tabular-nums}
.ticket-lines small{display:block;color:var(--ink-dim);font-size:12px}
.ticket-total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:14px 0;font-family:var(--font-head);font-size:20px}
.ticket-total output{font-size:32px;font-variant-numeric:tabular-nums}
.ticket-wait{margin-bottom:12px;padding:8px 10px;border:1px dashed var(--ink-dim);font-size:14px}
.btn-block{width:100%}
.ticket .fine{color:var(--ink-dim)}

/* Bowling */
.sec-alley{background:var(--alley-2)}
.bowl-grid{display:grid;gap:24px}
@media (min-width:900px){.bowl-grid{grid-template-columns:minmax(0,360px) minmax(0,1fr);grid-template-areas:"lane head" "lane side";column-gap:48px;align-items:start}.bowl-head{grid-area:head}.lane-wrap{grid-area:lane}.bowl-side{grid-area:side}}
.lane-wrap{min-width:0}
#lane-canvas{display:block;width:100%;max-width:360px;height:auto;aspect-ratio:3/5;margin-inline:auto;border-radius:6px;background:var(--alley-3);box-shadow:var(--shadow);cursor:pointer;touch-action:manipulation}
.bowl-side{min-width:0}
.scoresheet{width:100%;border-collapse:collapse;table-layout:fixed;background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums}
.scoresheet th{padding:4px;border:1px solid var(--ink-dim);background:var(--paper-2);font-family:var(--font-stencil);font-weight:700;font-size:12px;letter-spacing:.08em;text-align:center}
.scoresheet td{height:58px;padding:0;border:1px solid var(--ink-dim);vertical-align:top}
.marks{display:flex;justify-content:flex-end;height:24px}
.mk{display:grid;place-items:center;width:24px;height:24px;border-left:1px solid var(--ink-dim);border-bottom:1px solid var(--ink-dim);font-weight:700}
.mk.f{color:var(--foul-paper)}
.cum{display:block;padding-top:2px;text-align:center;font-family:var(--font-head);font-size:20px}
.game-msg{min-height:2.6em;margin-top:16px;font-family:var(--font-head);font-size:clamp(22px,3vw,30px);line-height:1.2;color:var(--neon-core)}
.game-msg.is-foul{color:var(--foul-dark);font-family:var(--font-stencil);font-weight:700;text-transform:uppercase}
.game-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.bowl-how{margin-top:12px;font-size:14px;color:var(--paper-dim)}

/* Quiz */
.quiz{display:grid;gap:26px;margin-top:28px}
.q{min-width:0;margin:0;padding:0;border:0}
.q legend{display:flex;gap:12px;align-items:baseline;margin-bottom:10px;padding:0;font-family:var(--font-head);font-size:clamp(20px,2.4vw,24px)}
.q-num{font-family:var(--font-stencil);font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--khaki)}
.q-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px}
.opt{position:relative;display:flex;align-items:center;min-height:54px;padding:10px 14px;border:1px solid var(--rule-strong);background:var(--alley-2);cursor:pointer;font-weight:500}
.opt input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.opt:focus-within{outline:2px solid var(--neon);outline-offset:2px}
.opt.is-on{border-color:var(--neon);background:rgba(255,211,108,.1);color:var(--neon-core)}
.result{margin-top:30px;padding:clamp(20px,4vw,40px);border:2px solid var(--neon);background:radial-gradient(90% 120% at 50% 0%,rgba(255,211,108,.12),transparent 60%),var(--alley-2);box-shadow:0 0 34px rgba(255,211,108,.14);text-align:center}
.result-pending{margin-top:30px;padding:26px;border:2px dashed var(--rule-strong);color:var(--paper-dim);text-align:center}
.result-you{font-family:var(--font-stencil);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--khaki)}
.result-name{margin-top:6px;font-family:var(--font-logo);font-size:clamp(40px,9vw,88px);line-height:1.05;color:var(--neon-core);text-shadow:0 0 8px var(--neon),0 0 26px var(--neon),0 0 50px rgba(227,57,46,.5)}
.result-desc{max-width:46ch;margin:14px auto 0;font-size:clamp(17px,2vw,20px)}
.result .cta-row{justify-content:center}
.share-text{max-width:60ch;margin:16px auto 0;padding:10px;border:1px dashed var(--rule-strong);font-size:14px;color:var(--paper-dim);word-break:break-word;user-select:all}
.copy-status{min-height:1.4em;margin-top:8px;font-size:14px;color:var(--go)}

/* Casting */
.cast-grid{display:grid;gap:32px;margin-top:28px}
@media (min-width:960px){.cast-grid{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:start}}
.notice{position:relative;padding:28px 22px 22px;background:var(--paper);color:var(--ink);box-shadow:var(--shadow);transform:rotate(-.8deg)}
.notice::before{content:"";position:absolute;top:10px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--foul);box-shadow:0 3px 4px rgba(0,0,0,.4)}
.notice h3{font-size:26px}
.notice-calm{margin-top:10px;font-family:var(--font-head);font-size:20px;color:var(--foul-deep)}
.reqs{margin:14px 0 0;padding:0;list-style:none}
.reqs li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:center;padding:8px 0;border-bottom:1px dotted rgba(30,27,21,.35)}
.reqs li::before{content:"X";display:grid;place-items:center;width:26px;height:26px;border:1px solid var(--ink-dim);font-weight:700;color:var(--foul-paper)}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.seg button{flex:1 1 200px;min-height:48px;padding:10px 14px;border:1px solid var(--rule-strong);background:transparent;color:var(--paper);font:600 15px/1.2 var(--font-body);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--neon);background:rgba(255,211,108,.1);color:var(--neon-core)}

/* Meet Naf */
.naf-grid{display:grid;gap:36px;align-items:center}
@media (min-width:900px){.naf-grid{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}}
.polaroids{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:520px}
.polaroid{margin:0;padding:10px 10px 12px;background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.polaroid img{display:block;width:100%;height:auto;aspect-ratio:4/5;object-fit:cover;background:var(--paper-2)}
.polaroid figcaption{padding-top:8px;font-family:var(--font-head);font-size:15px;line-height:1.2}
.p1{transform:rotate(-3deg)}
.p2{margin-top:28px;transform:rotate(2.5deg)}
.naf-copy p + p{margin-top:14px}
.naf-copy .lead{margin-top:16px}
.dossier{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 18px;margin:22px 0 0;padding:16px;border:1px dashed rgba(198,178,130,.5);background:rgba(95,96,53,.14)}
.dossier dt{font-family:var(--font-stencil);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--khaki);padding-top:3px}
:root[lang="he"] .dossier dt{letter-spacing:0;font-size:14px}
.dossier dd{margin:0}

/* Reviews */
.reviews{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:1px;margin-top:28px;padding:1px;background:var(--rule-strong)}
.review{margin:0;padding:22px 20px;background:var(--alley)}
.rmark{display:grid;place-items:center;width:34px;height:34px;margin-bottom:14px;border:1px solid var(--rule-strong);font-family:var(--font-head);font-size:20px;color:var(--neon)}
.review blockquote{margin:0;font-family:var(--font-head);font-size:22px;line-height:1.25}
.review figcaption{margin-top:12px;font-family:var(--font-stencil);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--khaki)}
:root[lang="he"] .review figcaption{letter-spacing:0;font-size:14px}

/* FAQ */
.faq{max-width:860px;margin-top:24px;border-top:1px solid var(--rule)}
.faq-item{border-bottom:1px solid var(--rule)}
.faq-item h3{font-size:inherit}
.faq-q{display:flex;justify-content:space-between;align-items:center;gap:16px;width:100%;padding:18px 0;border:0;background:none;color:var(--paper);font:400 clamp(18px,2vw,21px)/1.25 var(--font-head);text-align:start;cursor:pointer}
.pm{position:relative;flex:none;width:20px;height:20px}
.pm::before,.pm::after{content:"";position:absolute;top:9px;left:0;width:20px;height:2px;background:var(--neon);transition:transform .2s ease,opacity .2s ease}
.pm::after{transform:rotate(90deg)}
.faq-q[aria-expanded="true"] .pm::after{transform:rotate(0);opacity:0}
.faq-a p{max-width:68ch;padding-bottom:18px;color:var(--paper-dim)}

/* Forms */
.sec-book{background:var(--alley-2)}
.form-card{margin-top:28px;padding:clamp(18px,3vw,32px);border:1px solid var(--rule);background:var(--alley)}
.fset{min-width:0;margin:0 0 22px;padding:0;border:0}
.fset legend,.field > label{display:block;margin-bottom:8px;padding:0;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.ccard{position:relative;display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:58px;padding:10px 14px;border:1px solid var(--rule-strong);background:var(--alley-3);cursor:pointer;font-weight:500}
.ccard input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.ccard:focus-within{outline:2px solid var(--neon);outline-offset:2px}
.ccard.is-on{border-color:var(--neon);background:rgba(255,211,108,.09);box-shadow:inset 0 0 0 1px var(--neon);color:var(--neon-core)}
.ccard small{font-family:var(--font-stencil);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--khaki)}
:root[lang="he"] .ccard small{letter-spacing:0;font-size:12px}
.ccard.is-disabled{cursor:not-allowed;color:var(--paper-dim);background:repeating-linear-gradient(-45deg,transparent 0 8px,rgba(240,230,203,.05) 8px 16px),var(--alley-3)}
.fields{display:grid;gap:18px}
@media (min-width:720px){.fields{grid-template-columns:1fr 1fr}}
.field{min-width:0}
.field-wide{grid-column:1/-1}
input[type="text"],input[type="tel"],input[type="date"],input[type="time"],input[type="number"],select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--rule-strong);border-radius:3px;background:var(--alley-3);color:var(--paper);font:inherit}
textarea{min-height:96px;resize:vertical}
input[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--foul);box-shadow:0 0 0 1px var(--foul)}
.hint{margin-top:6px;font-size:13px;color:var(--paper-dim)}
.err{margin-top:6px;font-size:14px;font-weight:600;color:var(--err)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--rule);background:var(--alley-3);cursor:pointer}
.check input{flex:none;width:20px;height:20px;margin-top:2px;accent-color:var(--foul)}
.check.is-disabled{cursor:not-allowed;color:var(--paper-dim)}
.check-price{color:var(--neon);font-variant-numeric:tabular-nums;white-space:nowrap}
.check-note{display:block;font-size:12px;font-weight:600;color:var(--candle)}
.check-hours{display:flex;align-items:center;gap:10px;font-size:14px}
.check-hours input{width:76px;min-height:40px}
.form-actions{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:24px}
.err-summary{margin-top:16px}
.outbox{margin-top:24px;padding:20px;border-top:8px solid var(--candle);background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.outbox:focus{outline:none}
.ob-head{display:flex;justify-content:space-between;gap:12px;padding-bottom:8px;border-bottom:2px solid var(--ink);font-family:var(--font-stencil);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.ob-shabbos{margin-top:12px;padding:8px 10px;background:rgba(255,182,72,.25);font-weight:600}

.ob-text{margin:12px 0;padding:12px;border:1px dashed var(--ink-dim);background:var(--paper-2);font:15px/1.55 var(--font-body);white-space:pre-wrap;word-break:break-word}
.ob-actions{display:flex;flex-wrap:wrap;gap:10px}
.ob-note,.ob-copy{margin-top:10px;font-size:14px;color:var(--ink-dim)}

/* v2: hero price line + occasions */
.hero-from{display:inline-block;margin-top:16px;padding:6px 12px;border:1px dashed var(--rule-strong);font-weight:600;font-variant-numeric:tabular-nums;color:var(--neon-core)}
.occ-band{padding-block:20px 24px;border-top:1px solid var(--rule);background:var(--alley-2)}
.occ-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.occ-title{margin-inline-end:6px;font-family:var(--font-head);font-size:20px}
.occ{min-height:44px;padding:8px 16px;border:1px solid var(--rule-strong);border-radius:999px;background:transparent;color:var(--paper);font:500 15px/1.2 var(--font-body);cursor:pointer}
.occ:hover{border-color:var(--khaki)}
.occ[aria-pressed="true"]{background:var(--neon);border-color:var(--neon);color:var(--ink)}
.occ-status{margin-top:10px;font-size:14px;color:var(--paper-dim)}

/* v2: packages as collectible score cards */
.pk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px}
.row.pk{display:flex;flex-direction:column;gap:6px;padding:16px 14px 0;border:2px solid var(--ink);border-bottom:0;background:var(--paper);color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.4)}
.pk.is-on{background:var(--paper);box-shadow:0 0 0 3px var(--foul),0 8px 0 rgba(0,0,0,.4)}
.pk-candle,.pk-candle.is-on{background:var(--paper-warm)}
.shabbos-line .pk.is-on{background:var(--paper-warm);box-shadow:0 0 0 3px var(--candle),0 0 26px rgba(255,182,72,.45)}
.pk .bulb{margin:0;width:12px;height:12px;background:var(--alley);box-shadow:none}
.pk.is-on .bulb{background:var(--foul);box-shadow:0 0 8px var(--foul)}
.pk .row-main{padding-inline-end:76px}
.pk .row-name{display:block;color:var(--ink);font-size:21px;line-height:1.15}
.pk .row-dur{display:block;margin:4px 0 0;color:var(--olive)}
.pk .row-desc{color:var(--ink-dim)}
.pk .badge{margin:6px 0 0}
.pk .badge-line{color:var(--ink);border-color:var(--ink)}
.pk .row-price{position:absolute;top:0;inset-inline-end:0;min-width:72px;padding:6px 8px;border-inline-start:2px solid var(--ink);border-bottom:2px solid var(--ink);background:var(--paper-2);color:var(--ink);font-size:17px;text-align:center}
.pk::after{content:"";display:block;height:14px;margin:auto -14px 0;border-top:1px solid var(--ink-dim);border-bottom:2px solid var(--ink);background:repeating-linear-gradient(90deg,transparent 0 21px,var(--ink-dim) 21px 22px)}
@media (hover:hover) and (prefers-reduced-motion:no-preference){.pk{transition:transform .18s ease,box-shadow .18s ease}.pk:hover{transform:rotate(-1.2deg) translateY(-3px)}.pk-grid .pk:nth-child(even):hover{transform:rotate(1.2deg) translateY(-3px)}}
.board-counter{padding:8px 6px 0;font-family:var(--font-stencil);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--candle)}
:root[lang="he"] .board-counter{letter-spacing:0;font-size:14px}
.ticket-city{display:grid;gap:6px;margin-top:12px;font-size:14px;font-weight:600}
.ticket select{background:var(--paper-2);color:var(--ink);border-color:var(--ink-dim)}
.ticket-deposit{margin:-6px 0 12px;font-size:14px;font-weight:700;color:var(--foul-deep)}

/* v2: booking calendar */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.dchip{display:inline-flex;align-items:center;padding:6px 10px;border:1px solid var(--rule-strong);background:var(--alley-3);font-size:14px;font-variant-numeric:tabular-nums}
.verdict{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:6px 12px;border:2px solid currentColor;font-size:14px;font-weight:600}
.verdict b{font-family:var(--font-stencil);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.verdict.is-blocked{color:var(--err);background:rgba(227,57,46,.14);transform:rotate(-1deg)}
.verdict.is-warn{color:var(--candle);background:rgba(255,182,72,.1)}
.verdict.is-ok{color:var(--go);background:rgba(134,227,166,.08)}
.fridays-left{font-family:var(--font-stencil);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--candle)}
:root[lang="he"] .fridays-left{letter-spacing:0;font-size:14px}
.nights{display:grid;gap:8px}
.night{position:relative;display:grid;grid-template-columns:minmax(6.5ch,auto) minmax(0,1fr);gap:2px 14px;align-items:baseline;padding:12px 14px;border:1px solid var(--rule-strong);background:var(--alley-3);cursor:pointer}
.night input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.night:focus-within{outline:2px solid var(--neon);outline-offset:2px}
.night.is-on{border-color:var(--candle);box-shadow:inset 0 0 0 1px var(--candle);background:rgba(255,182,72,.09)}
.night-date{grid-row:span 2;font-family:var(--font-head);font-size:19px;line-height:1.15}
.night-heb{font-weight:600;color:var(--candle)}
.night-times{font-size:14px;color:var(--paper-dim);font-variant-numeric:tabular-nums}
.night-warn{grid-column:1/-1;font-size:13px;color:var(--candle)}
.cards.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.cards.two .ccard{min-height:48px}

/* v2: Walter's Ruling */
.split{display:grid;gap:28px;margin-top:28px}
@media (min-width:960px){.split{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);align-items:start}}
.range-row{display:flex;align-items:center;gap:12px}
.range-row input{flex:1;min-width:0;accent-color:var(--foul)}
.range-row output{min-width:4ch;font-family:var(--font-head);font-size:20px;font-variant-numeric:tabular-nums;color:var(--neon)}
.range-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--paper-dim)}
.doc{position:relative;overflow:hidden;padding:clamp(20px,3vw,34px);border:1px solid var(--ink-dim);background:repeating-linear-gradient(180deg,transparent 0 27px,rgba(30,27,21,.06) 27px 28px),var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.doc-court{padding-bottom:10px;border-bottom:3px double var(--ink);font-family:var(--font-stencil);font-weight:700;font-size:12px;letter-spacing:.16em;text-align:center;text-transform:uppercase}
:root[lang="he"] .doc-court{letter-spacing:0;font-size:14px}
.doc-no{margin-top:12px;font-family:var(--font-head);font-size:clamp(22px,3vw,30px);text-align:center;font-variant-numeric:tabular-nums}
.doc-date{text-align:center;font-size:13px;color:var(--ink-dim)}
.doc-clauses{margin:16px 0 0;padding:0;list-style:none}
.doc-clauses li{padding:3px 0}
.doc-clauses b{font-variant:small-caps;letter-spacing:.04em}
.doc-order{margin-top:14px;padding:12px 14px;border:2px solid var(--ink)}
.doc-order b{display:block;font-family:var(--font-stencil);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.doc-total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:10px;font-family:var(--font-head);font-size:22px;font-variant-numeric:tabular-nums}
.doc-sanction{margin-top:10px;font-style:italic}
.doc-sign{margin-top:18px;padding-top:6px;border-top:1px solid var(--ink);max-width:260px;font-size:13px}
.doc-stamp{position:absolute;top:96px;inset-inline-end:5%;padding:4px 14px;border:4px double var(--foul);color:var(--foul-paper);font-family:var(--font-stencil);font-weight:700;font-size:clamp(20px,3vw,28px);letter-spacing:.12em;text-transform:uppercase;transform:rotate(-14deg);opacity:.85;pointer-events:none}
@media (prefers-reduced-motion:no-preference){.doc-stamp.thump{animation:thump .3s cubic-bezier(.2,1.6,.4,1)}}
@keyframes thump{0%{transform:rotate(-14deg) scale(1.6);opacity:0}100%{transform:rotate(-14deg) scale(1);opacity:.85}}
.doc-actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:18px}
.doc-status{font-size:14px;font-weight:700;color:var(--foul-deep)}

/* v2: Walter-gram */
.prompter{position:relative;margin-bottom:18px;padding:22px 22px 18px;border:2px solid var(--rule-strong);border-radius:18px;background:var(--pit);box-shadow:var(--shadow)}
@media (min-width:960px){.prompter{position:sticky;top:calc(var(--nav-h) + 24px)}}
.prompter::after{content:"";position:absolute;bottom:-12px;inset-inline-start:44px;width:22px;height:22px;background:var(--pit);border-right:2px solid var(--rule-strong);border-bottom:2px solid var(--rule-strong);transform:rotate(45deg)}
.prompter-head{display:flex;justify-content:space-between;gap:12px;font-family:var(--font-stencil);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--khaki)}
.rec{display:inline-flex;align-items:center;gap:6px;color:var(--foul-dark)}
.rec::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--foul)}
@media (prefers-reduced-motion:no-preference){.rec::before{animation:blink 1.2s steps(2,start) infinite}}
@keyframes blink{to{visibility:hidden}}
.script{margin-top:14px;font-family:var(--font-head);font-size:clamp(19px,2.2vw,24px);line-height:1.38;color:var(--neon-core)}
.script p + p{margin-top:10px}
.script .nm{color:var(--neon)}
.script .ph{color:var(--paper-dim);border-bottom:1px dashed currentColor}
.prompter-foot{margin-top:14px;font-size:13px;color:var(--paper-dim)}
.count{margin-top:6px;font-size:13px;color:var(--paper-dim);text-align:end;font-variant-numeric:tabular-nums}
.gram-price{margin-top:4px;font-family:var(--font-head);font-size:20px;color:var(--neon);font-variant-numeric:tabular-nums}

/* v2: Where's Walter? */
.hunt-grid{display:grid;gap:40px;align-items:center}
@media (min-width:900px){.hunt-grid{grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr)}}
.hunt-sub{margin-top:10px;font-family:var(--font-head);font-size:clamp(20px,2.4vw,26px);color:var(--neon-core)}
.hunt-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:1px;margin:24px 0 0;padding:1px;list-style:none;background:var(--rule-strong)}
.hunt-steps li{padding:14px 16px;background:var(--alley-2)}
.hunt-steps strong{display:block;margin-bottom:4px;font-family:var(--font-stencil);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--khaki)}
:root[lang="he"] .hunt-steps strong{letter-spacing:0;font-size:15px}
.hunt-steps p{color:var(--paper-dim);font-size:15px}
.hunt-cta{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:22px}
.hunt-price{margin-top:18px;font-weight:600}
.phone{justify-self:center;width:min(100%,250px);padding:12px;border:2px solid var(--rule-strong);border-radius:36px;background:var(--pit);box-shadow:var(--shadow),inset 0 0 0 5px var(--alley-3);transform:rotate(3deg)}
.phone-screen{position:relative;display:flex;flex-direction:column;gap:10px;min-height:420px;padding:30px 12px 16px;border-radius:26px;background:var(--alley-2)}
.phone-screen::before{content:"";position:absolute;top:10px;left:50%;width:70px;height:8px;margin-left:-35px;border-radius:8px;background:var(--pit)}
.ph-title{font-family:var(--font-logo);font-size:19px;line-height:1.1;color:var(--neon-core);text-shadow:0 0 8px var(--neon)}
.ph-frame{font-family:var(--font-stencil);font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--khaki)}
.ph-sheet{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--ink);background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums}
.ph-sheet span{display:grid;place-content:center;justify-items:center;height:38px;line-height:1.1;border:1px solid var(--ink-dim);font-weight:700;font-size:13px}
.ph-sheet small{display:block;font-size:10px;font-weight:600;color:var(--ink-dim)}
.ph-photo{display:grid;place-items:center;height:92px;border:2px dashed var(--rule-strong);color:var(--paper-dim);font-size:13px}
.ph-code{padding:10px;border:1px solid var(--rule-strong);background:var(--alley-3);color:var(--paper-dim);font-size:13px}
.ph-btn{padding:10px;border-radius:4px;background:var(--foul-btn);color:var(--foul-ink);font-weight:700;text-align:center}

/* grid and flex children may shrink below their content, so card grids reflow instead of pushing the page wider */
.counter > *,.split > *,.hero-grid > *,.naf-grid > *,.bowl-grid > *,.cast-grid > *,.hunt-grid > *,.board-group{min-width:0}

/* QA r1: preview ribbon, lane-assignment drawer, phone layout */
.preview{background:var(--candle);color:var(--ink);font-size:13px;font-weight:600}
.preview-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px}
.preview-x{display:inline-grid;place-items:center;flex:none;width:44px;height:34px;border:0;background:transparent;color:var(--ink);font-size:22px;line-height:1;cursor:pointer}
.banner-row .candle{width:6px;height:18px;margin-top:14px}
.drawer{position:fixed;inset:0;z-index:80;display:flex;justify-content:flex-end;background:rgba(5,6,4,.6)}
.drawer-panel{display:flex;flex-direction:column;gap:14px;width:min(420px,100%);height:100%;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));background:var(--pit);border-inline-start:6px solid var(--gutter);box-shadow:var(--shadow)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:2px solid var(--neon)}
.drawer-title{font-family:var(--font-stencil);font-weight:700;font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--neon)}
:root[lang="he"] .drawer-title{letter-spacing:0;font-size:18px}
.lanes{display:grid;gap:4px;margin:0;padding:0;list-style:none;counter-reset:lane}
.lanes a{display:grid;grid-template-columns:48px minmax(0,1fr);align-items:center;gap:12px;min-height:46px;padding:4px 8px 4px 4px;border:1px solid var(--rule);background:var(--alley-2);color:var(--paper);font-family:var(--font-head);font-size:18px;text-decoration:none;counter-increment:lane}
.lanes a::before{content:counter(lane,decimal-leading-zero);display:grid;place-items:center;height:36px;background:var(--alley-3);color:var(--neon);font-family:var(--font-stencil);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 0 8px rgba(255,211,108,.6)}
.lanes a:hover{border-color:var(--khaki)}
.drawer-book{width:100%}
.drawer-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.drawer-tools .tool{width:100%;height:48px}
#dr-shabbos[aria-pressed="true"]{background:var(--candle);border-color:var(--candle);color:var(--ink)}
#dr-mute[aria-pressed="true"]{border-color:var(--khaki);color:var(--khaki)}
.mini-total{display:none}
@media (max-width:959px){
  .mini-total{position:sticky;top:calc(var(--nav-live,64px) + 6px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 8px 8px 14px;padding-inline:14px 8px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:0 8px 18px rgba(0,0,0,.45)}
  .mini-total b{font-family:var(--font-head);font-size:20px;font-weight:400;font-variant-numeric:tabular-nums}
  .mini-total small{display:block;font-size:12px;color:var(--ink-dim)}
  .mini-total .btn{min-height:44px;padding:8px 12px;font-size:14px}
}
@media (max-width:700px){
  .board{padding:0;border:0;background:none;box-shadow:none}
  .shabbos-line{padding:12px 10px}
  .duo-line{padding:10px}
  .shabbos-head{padding-inline:0}
  .hero-grid{display:flex;flex-direction:column;gap:0}
  .hero-copy,.hero-art{display:contents}
  .hero-copy > *{order:2}
  .hero-copy > .eyebrow,.hero-copy > .marquee,.hero-copy > .marquee-live,.hero-copy > .now{order:0}
  .poster{order:1;max-width:270px;margin-top:18px;align-self:flex-start}
  .dude-board{order:3;max-width:240px;margin-top:28px;align-self:flex-start}
  .doc-stamp{top:78px;inset-inline-end:14%;font-size:18px;border-width:3px}
}
.ob-head + .ob-status{margin-top:12px}
.ob-status{font-family:var(--font-head);font-size:21px;color:var(--ink)}
.ob-note-sent{margin-top:2px;font-size:13px;color:var(--ink-dim)}
.nw{white-space:nowrap;unicode-bidi:isolate}

/* Footer + phone bar */
.foot{padding-block:40px;border-top:1px solid var(--rule);font-size:14px;color:var(--paper-dim)}
.foot-grid{display:grid;gap:12px}
.foot-strong{color:var(--paper);font-family:var(--font-head);font-size:18px}
.mbar{position:fixed;z-index:58;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(17,20,16,.97);border-top:1px solid var(--rule-strong);transition:transform .25s ease}
.mbar .btn{flex:1;min-height:46px;padding-inline:10px;font-size:15px}
.mbar.is-away{transform:translateY(115%)}
@media (min-width:721px){.mbar{display:none}}
@media (max-width:720px){body{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

"q1": "זה באמת ג׳ון גודמן?",
"a1": "לא. זה נף. הוא יותר טוב: הוא גם עושה תספורות.",
"q2": "הוא מדבר עברית?",
"a2": "כן, במבטא בוסטוני. הוא עובר בין עברית לאנגלית לפי מי שמפר את החוקים.",
"q3": "מה עם שבת?",
"a3": "\"בשבת אני לא מגלגל.\" טופס ההזמנה בודק בלוח העברי האמיתי: לא בשבת, לא ביום טוב, ובשישי וולטר בבית לפני הדלקת נרות. רוצים אותו בשולחן השבת? זה ספיישל שומר שבת. מוצ״ש אחרי ההבדלה? \"מגלגלים במוצ״ש\".",
"q4": "זה כשר?",
"a4": "הוא לא מביא אוכל. ההכשר של הקייטרינג קובע. הוא רק יאכוף אותו.",
"q5": "מה הוא לובש?",
"a5": "משקפי ירי צהובים בסגנון טייסים, אפוד דייגים חאקי, חולצת באולינג קצרה, זקנקן ושעון דיגיטלי שחור. הדרס קוד שלכם, האפוד שלו.",
"q6": "הוא באמת אוכף חוקים?",
"a6": "בעדינות. בדרך כלל. תגידו לו מראש למי מותר להציק ומי מחוץ לתחום. סבתא תמיד מחוץ לתחום.",
"q7": "הוא יכול לברך או לעשות רוסט?",
"a7": "כן, בעברית או באנגלית. שולחים לו כמה שמות וסיפורים והוא כותב. הרוסט נשאר ידידותי.",
"q8": "עד לאן הוא מגיע?",
"a8": "לכל הארץ. במרכז ההגעה כלולה; רחוק יותר יתווספו דמי נסיעה, ודף הניקוד מציג אותם ברגע שבוחרים עיר.",
"q9": "הוא יכול לספר אותי?",
"a9": "כן. מוסיפים \"תספורת תקנית\" והוא מקים כיסא באירוע: תספורות קצרות, פייד, עיצוב זקן. לא בשבת.",
"q10": "איך משלמים?",

      mg.addColorStop(0, C.olive); mg.addColorStop(1, C.neon);
      ctx.fillStyle = mg; ctx.fillRect(mx, my, mw * FOUL_AT, 12);
      ctx.fillStyle = C.foul; ctx.fillRect(mx + mw * FOUL_AT, my, mw * (1 - FOUL_AT), 12);
      ctx.font = '700 10px ' + stencil(); ctx.textBaseline = 'top';
      ctx.fillStyle = C.ink; ctx.textAlign = 'left'; ctx.fillText(t('meterRelease').toUpperCase(), mx, my + 16);
      ctx.fillStyle = C.ink; ctx.textAlign = 'right'; ctx.fillText(t('meterFoul').toUpperCase(), mx + mw, my + 16);
      if (phase === 'power') {
        const m = meterNow(ts), x = mx + mw * m;
        ctx.fillStyle = C['neon-core']; ctx.fillRect(x - 2, my - 4, 4, 20);
      }
      particles.forEach((p) => {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = C.paper; ctx.fillRect(-2, -5, 4, 10); ctx.fillStyle = C.foul; ctx.fillRect(-2, -2, 4, 1.6);
        ctx.restore();
      });
      if (ts < foulFlashUntil) {
        ctx.fillStyle = 'rgba(227,57,46,.28)'; ctx.fillRect(0, 0, W, H);
        ctx.save(); ctx.translate(150, 250); ctx.rotate(-0.12);
        ctx.font = '700 20px ' + stencil(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const txt = t('msgFoul').toUpperCase(), tw = Math.min(270, ctx.measureText(txt).width + 24);
        ctx.fillStyle = C.paper; ctx.fillRect(-tw / 2, -20, tw, 40);
        ctx.strokeStyle = C.foul; ctx.lineWidth = 3; ctx.strokeRect(-tw / 2, -20, tw, 40);
        ctx.fillStyle = C['foul-paper']; ctx.fillText(txt, 0, 1, 250);
        ctx.restore();
      }
    }
    function loop(ts) {
      raf = 0;
      const dt = lastTs ? Math.min(3, (ts - lastTs) / 16.667) : 1;
      lastTs = ts;
      if (phase === 'rolling') { step(dt); checkEnd(ts); }
      updateParticles(dt);
      draw(ts);
      const busy = phase === 'aim' || phase === 'power' || phase === 'rolling' || particles.length > 0 || ts < foulFlashUntil;
      if (visible && busy) raf = requestAnimationFrame(loop); else lastTs = 0;
    }
    function ensureLoop() { if (!raf && visible) raf = requestAnimationFrame(loop); }
    function resize() {
      const w = canvas.clientWidth || 300;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(w * (H / W) * dpr);
      ctx.setTransform((canvas.width / W), 0, 0, (canvas.height / H), 0, 0);
      draw(performance.now());
    }
    canvas.addEventListener('click', act);
    canvas.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); act(); } });
    rollBtn.addEventListener('click', act);
    $('#btn-reset').addEventListener('click', newGame);
    if ('ResizeObserver' in window) new ResizeObserver(resize).observe(canvas); else window.addEventListener('resize', resize);
    if ('IntersectionObserver' in window) {
      new IntersectionObserver((entries) => { visible = entries.some((en) => en.isIntersecting); if (visible) ensureLoop(); }, { threshold: 0 }).observe(canvas);
    }
    rerender.push(() => { renderMsg(); updateBtn(); renderSheet(); draw(performance.now()); });
    newGame();
    resize();
    return { redraw: () => draw(performance.now()) };
  })();
  if (game && document.fonts && document.fonts.ready) document.fonts.ready.then(() => game.redraw()).catch(() => {});

  /* ---------- Boot ---------- */
  const saved = store.get('bl-lang');
  const initial = saved || ((navigator.language || '').toLowerCase().startsWith('he') ? 'he' : 'en');
  applyLang(initial);
  renderShabbos();
  if (OCC[location.hash.slice(1)]) applyOccasion(location.hash.slice(1), true);
})();
</script>
